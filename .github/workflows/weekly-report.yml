name: Weekly Report

on:
  schedule:
    # 每周五晚上 23:00 SGT = UTC 15:00
    - cron: '0 15 * * 5'
  
  workflow_dispatch:  # 允许手动触发

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Aggregate weekly data
        run: |
          python scripts/weekly_aggregator.py
      
      - name: Generate weekly reports
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/weekly_report_generator_v2.py
      
      - name: Copy weekly reports to reports/weekly (frontend API format)
        run: |
          REPORTS_SUBDIR=$(ls -td reports/20*-*-* 2>/dev/null | head -1)
          [ -z "$REPORTS_SUBDIR" ] && echo "No reports dir found" && exit 0
          WEEK_DATE=$(basename "$REPORTS_SUBDIR")
          YEAR=$(echo "$WEEK_DATE" | cut -d'-' -f1)
          WEEK=$(date -d "$WEEK_DATE" +%V)
          mkdir -p reports/weekly
          [ -f "$REPORTS_SUBDIR/weekly_report_zh_v2.md" ] && cp "$REPORTS_SUBDIR/weekly_report_zh_v2.md" "reports/weekly/weekly_zh_${YEAR}_W${WEEK}_${WEEK_DATE}.md"
          [ -f "$REPORTS_SUBDIR/weekly_report_en_v2.md" ] && cp "$REPORTS_SUBDIR/weekly_report_en_v2.md" "reports/weekly/weekly_en_${YEAR}_W${WEEK}_${WEEK_DATE}.md"
          [ -f "$REPORTS_SUBDIR/weekly_report_es_v2.md" ] && cp "$REPORTS_SUBDIR/weekly_report_es_v2.md" "reports/weekly/weekly_es_${YEAR}_W${WEEK}_${WEEK_DATE}.md"
          echo "Copied to reports/weekly/ (YEAR=$YEAR WEEK=$WEEK DATE=$WEEK_DATE)"
      
      - name: Convert to HTML and update website
        run: |
          python scripts/convert_to_html.py
          python scripts/update_website.py
      
      # 必须用 PAT 推送：用 GITHUB_TOKEN 的 push 不会触发 Deploy to GitHub Pages。仓库 Settings → Secrets → 新建 GH_PAT（repo 权限的 Personal Access Token）。
      - name: Commit and push
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'

          # 先拉取远程最新变更，避免推送冲突
          git fetch origin main
          git rebase origin/main || {
            echo "⚠️ Rebase failed, trying merge strategy..."
            git rebase --abort 2>/dev/null || true
            git pull --no-rebase origin main --allow-unrelated-histories || true
          }

          git add reports/ docs/ data/weekly/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📄 Weekly report: $(date +'%Y-%m-%d')"
            # 重试推送逻辑（最多 3 次）
            for i in 1 2 3; do
              if git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" HEAD:main; then
                echo "✅ Push succeeded on attempt $i"
                break
              else
                echo "⚠️ Push failed on attempt $i, pulling and retrying..."
                git pull --rebase origin main || true
                sleep 5
              fi
            done
          fi
