name: Daily Data Collection

on:
  schedule:
    # 每天早上 10:00 SGT (UTC+8) = UTC 02:00
    - cron: '0 2 * * *'

  workflow_dispatch:  # 允许手动触发
    inputs:
      use_v2:
        description: '使用 V2 版本（新分类系统）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily collection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          # 无数据时用示例数据跑通 pipeline，确保仍会生成 docs/daily-reports.js 并触发前端部署
          USE_MOCK_IF_EMPTY: "1"
        run: |
          # 使用 V2 版本（新分类系统）
          if [ -f "scripts/daily_job_v2.py" ]; then
            echo "Running V2 pipeline..."
            python scripts/daily_job_v2.py
          else
            echo "Running V1 pipeline..."
            python scripts/daily_job.py
          fi

      # 必须用 PAT 推送：用 GITHUB_TOKEN 的 push 不会触发 Deploy to GitHub Pages。仓库 Settings → Secrets → 新建 GH_PAT（repo 权限的 Personal Access Token）。
      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'

          # 先拉取远程最新变更，避免推送冲突
          git fetch origin main
          git rebase origin/main || {
            echo "⚠️ Rebase failed, trying merge strategy..."
            git rebase --abort 2>/dev/null || true
            git pull --no-rebase origin main --allow-unrelated-histories || true
          }

          git add data/
          git add reports/
          # 仅当日报 pipeline 成功生成时才有这些文件，不存在则不 add，避免报错
          [ -f docs/daily-reports.js ] && git add docs/daily-reports.js || true
          [ -d docs/reports/daily ] && git add docs/reports/daily/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Daily data: $(date +'%Y-%m-%d')"
            # 重试推送逻辑（最多 3 次）
            for i in 1 2 3; do
              if git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" HEAD:main; then
                echo "✅ Push succeeded on attempt $i"
                break
              else
                echo "⚠️ Push failed on attempt $i, pulling and retrying..."
                git pull --rebase origin main || true
                sleep 5
              fi
            done
          fi

      - name: Summary
        run: |
          echo "## 📊 每日数据收集完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 日期: $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "- 数据目录: data/processed/" >> $GITHUB_STEP_SUMMARY
          echo "- 报告目录: reports/daily/" >> $GITHUB_STEP_SUMMARY

  # 失败时发送通知
  notify-failure:
    runs-on: ubuntu-latest
    needs: collect
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "## ❌ 日报生成失败" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 日期: $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "- 请检查工作流日志：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 可能的原因：" >> $GITHUB_STEP_SUMMARY
          echo "- OpenAI API 调用超时" >> $GITHUB_STEP_SUMMARY
          echo "- Twitter API 配额耗尽" >> $GITHUB_STEP_SUMMARY
          echo "- 代码 bug" >> $GITHUB_STEP_SUMMARY

      # 如果配置了邮件通知（需要设置 NOTIFY_EMAIL secret）
      - name: Send email notification
        if: vars.NOTIFY_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Stablecoin Intel 日报生成失败 - ${{ github.run_id }}"
          to: ${{ vars.NOTIFY_EMAIL }}
          from: Stablecoin Intel Bot
          body: |
            日报生成失败！

            日期: ${{ github.event.repository.updated_at }}
            工作流: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            请检查并手动运行 /daily-report 或修复问题。
