name: Daily Data Collection

on:
  schedule:
    # 每天早上 10:00 SGT (UTC+8) = UTC 02:00
    - cron: '0 2 * * *'

  workflow_dispatch:  # 允许手动触发
    inputs:
      use_v2:
        description: '使用 V2 版本（新分类系统）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily collection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          # 使用 V2 版本（新分类系统）
          if [ -f "scripts/daily_job_v2.py" ]; then
            echo "Running V2 pipeline..."
            python scripts/daily_job_v2.py
          else
            echo "Running V1 pipeline..."
            python scripts/daily_job.py
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'

          # 添加数据、报告、以及前端用的 docs（daily-reports.js + docs/reports/daily/*.md）
          git add data/
          git add reports/
          git add docs/daily-reports.js
          git add docs/reports/daily/

          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Daily data: $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Summary
        run: |
          echo "## 📊 每日数据收集完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 日期: $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "- 数据目录: data/processed/" >> $GITHUB_STEP_SUMMARY
          echo "- 报告目录: reports/daily/" >> $GITHUB_STEP_SUMMARY
