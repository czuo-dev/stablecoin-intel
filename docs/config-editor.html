<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稳定币情报 - 关键词配置 V1.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2rem;
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: #252545;
            border: none;
            border-radius: 8px;
            color: #aaa;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #303060;
        }

        .tab.active {
            background: #00d4ff;
            color: #1a1a2e;
            font-weight: 600;
        }

        .panel {
            display: none;
            background: #1e1e3f;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .panel.active {
            display: block;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1rem;
            color: #00d4ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #00d4ff;
            border-radius: 2px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: #252545;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #333;
            transition: all 0.3s;
        }

        .card:hover {
            border-color: #00d4ff;
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-title {
            font-weight: 600;
            color: #fff;
        }

        .card-twitter {
            font-size: 0.8rem;
            color: #1da1f2;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: #1a1a2e;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            color: #888;
            border: 1px solid #333;
        }

        .keyword-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .keyword {
            background: #303060;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .keyword .remove {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff4757;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input[type="text"], select {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            font-size: 0.95rem;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #00d4ff;
            color: #1a1a2e;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #00b8e6;
        }

        .btn-secondary {
            background: #303060;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #404080;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .json-preview {
            background: #0d0d1a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.8rem;
            max-height: 300px;
            overflow: auto;
            white-space: pre-wrap;
            color: #8be9fd;
        }

        .status {
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .status.success {
            display: block;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
        }

        .status.error {
            display: block;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid #ff4757;
            color: #ff4757;
        }

        .tier-label {
            background: #404080;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        @media (max-width: 768px) {
            .card-grid {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-direction: column;
            }

            .tab {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 稳定币情报 - 关键词配置 V1.1</h1>
            <p class="subtitle">配置监控关键词、竞争对手、客户和 Twitter 账号</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="competitors">🏢 竞争对手</button>
            <button class="tab" data-tab="customers">🤝 客户</button>
            <button class="tab" data-tab="industry">📈 行业话题</button>
            <button class="tab" data-tab="keywords">🔍 搜索关键词</button>
            <button class="tab" data-tab="accounts">🐦 Twitter账号</button>
            <button class="tab" data-tab="filters">🚫 过滤规则</button>
            <button class="tab" data-tab="export">💾 导出配置</button>
        </div>

        <!-- 竞争对手 -->
        <div class="panel active" id="competitors">
            <div class="section">
                <h3 class="section-title">Tier 0 - 托管服务商</h3>
                <div class="card-grid" id="tier0-grid"></div>
            </div>
            <div class="section">
                <h3 class="section-title">Tier 1 - 支付基础设施</h3>
                <div class="card-grid" id="tier1-grid"></div>
            </div>
            <div class="input-group">
                <select id="competitor-tier">
                    <option value="tier_0_custody">Tier 0 - 托管</option>
                    <option value="tier_1_payment_infra">Tier 1 - 支付</option>
                </select>
                <input type="text" id="new-competitor-name" placeholder="公司名称">
                <input type="text" id="new-competitor-twitter" placeholder="Twitter账号">
                <button class="btn btn-primary" onclick="addCompetitor()">+ 添加</button>
            </div>
        </div>

        <!-- 客户 -->
        <div class="panel" id="customers">
            <div class="section">
                <h3 class="section-title">Layer A - 重点客户（全量监控）</h3>
                <div class="card-grid" id="layer-a-grid"></div>
            </div>
            <div class="section">
                <h3 class="section-title">上下文关键词（用于 Layer B 过滤）</h3>
                <div class="keyword-list" id="context-keywords-list"></div>
                <div class="input-group">
                    <input type="text" id="new-context-keyword" placeholder="输入关键词">
                    <button class="btn btn-primary" onclick="addContextKeyword()">+ 添加</button>
                </div>
            </div>
            <div class="input-group">
                <input type="text" id="new-customer-name" placeholder="客户名称">
                <input type="text" id="new-customer-twitter" placeholder="Twitter账号">
                <button class="btn btn-primary" onclick="addCustomer()">+ 添加客户</button>
            </div>
        </div>

        <!-- 行业话题 -->
        <div class="panel" id="industry">
            <div id="industry-topics-container"></div>
            <div class="section" style="margin-top: 20px;">
                <h3 class="section-title">添加新话题</h3>
                <div class="input-group">
                    <input type="text" id="new-topic-key" placeholder="话题ID (英文)">
                    <input type="text" id="new-topic-name" placeholder="话题名称">
                    <button class="btn btn-primary" onclick="addIndustryTopic()">+ 添加话题</button>
                </div>
            </div>
        </div>

        <!-- 搜索关键词 -->
        <div class="panel" id="keywords">
            <div class="section">
                <h3 class="section-title">主要关键词 (高优先级)</h3>
                <div class="keyword-list" id="primary-keywords-list"></div>
                <div class="input-group">
                    <input type="text" id="new-primary-keyword" placeholder="输入关键词">
                    <button class="btn btn-primary" onclick="addKeyword('primary')">+ 添加</button>
                </div>
            </div>
            <div class="section">
                <h3 class="section-title">次要关键词 (低优先级)</h3>
                <div class="keyword-list" id="secondary-keywords-list"></div>
                <div class="input-group">
                    <input type="text" id="new-secondary-keyword" placeholder="输入关键词">
                    <button class="btn btn-primary" onclick="addKeyword('secondary')">+ 添加</button>
                </div>
            </div>
        </div>

        <!-- Twitter账号 -->
        <div class="panel" id="accounts">
            <div class="section">
                <h3 class="section-title">KOL 和意见领袖</h3>
                <div class="keyword-list" id="kol-list"></div>
            </div>
            <div class="section">
                <h3 class="section-title">媒体账号</h3>
                <div class="keyword-list" id="media-list"></div>
            </div>
            <div class="input-group">
                <select id="account-type">
                    <option value="kol">KOL</option>
                    <option value="media">媒体</option>
                </select>
                <input type="text" id="new-account-username" placeholder="Twitter用户名">
                <input type="text" id="new-account-name" placeholder="显示名称">
                <button class="btn btn-primary" onclick="addAccount()">+ 添加</button>
            </div>
        </div>

        <!-- 过滤规则 -->
        <div class="panel" id="filters">
            <div class="section">
                <h3 class="section-title">排除关键词（匹配即过滤）</h3>
                <div class="keyword-list" id="exclude-keywords-list"></div>
                <div class="input-group">
                    <input type="text" id="new-exclude-keyword" placeholder="输入排除关键词">
                    <button class="btn btn-primary" onclick="addExcludeKeyword()">+ 添加</button>
                </div>
            </div>
            <div class="section">
                <h3 class="section-title">高信号关键词（降低互动阈值）</h3>
                <div class="keyword-list" id="high-signal-list"></div>
                <div class="input-group">
                    <input type="text" id="new-high-signal" placeholder="输入高信号关键词">
                    <button class="btn btn-primary" onclick="addSignalKeyword('high_signal')">+ 添加</button>
                </div>
            </div>
            <div class="section">
                <h3 class="section-title">中信号关键词</h3>
                <div class="keyword-list" id="medium-signal-list"></div>
                <div class="input-group">
                    <input type="text" id="new-medium-signal" placeholder="输入中信号关键词">
                    <button class="btn btn-primary" onclick="addSignalKeyword('medium_signal')">+ 添加</button>
                </div>
            </div>
        </div>

        <!-- 导出配置 -->
        <div class="panel" id="export">
            <div class="section">
                <h3 class="section-title">当前配置预览</h3>
                <div class="json-preview" id="json-preview"></div>
            </div>
            <div class="actions">
                <button class="btn btn-primary" onclick="downloadConfig()">📥 下载配置文件</button>
                <button class="btn btn-secondary" onclick="copyConfig()">📋 复制到剪贴板</button>
                <label class="btn btn-secondary">
                    📤 导入配置
                    <input type="file" accept=".json" onchange="importConfig(event)" style="display:none">
                </label>
            </div>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        // 默认配置 V1.1
        let config = {
            version: "1.1",
            last_updated: new Date().toISOString().split('T')[0],
            description: "稳定币情报系统关键词配置 V1.1",

            competitors: {
                tier_0_custody: [
                    {name: "Fireblocks", twitter: "FireblocksHQ"},
                    {name: "BitGo", twitter: "BitGo"},
                    {name: "Copper", twitter: "CopperHQ"},
                    {name: "Anchorage Digital", twitter: "Anchorage"},
                    {name: "Safeheron", twitter: "Safeheron"},
                    {name: "Cregis", twitter: "CregisOfficial"}
                ],
                tier_1_payment_infra: [
                    {name: "OSL", twitter: "OSL_exchange"},
                    {name: "BVNK", twitter: "bvnkfinance"}
                ]
            },

            customers: {
                layer_a: [
                    {name: "Vantage", twitter: "VantageMarkets"},
                    {name: "ToolBit", twitter: "ToolBitGlobal"},
                    {name: "WEEX", twitter: "WEEX_Official"},
                    {name: "Bitunix", twitter: "BitunixOfficial"},
                    {name: "Antalpha", twitter: "Antalpha_Plat"}
                ],
                context_keywords: ["stablecoin", "USDC", "USDT", "wallet", "custody", "payment", "settlement", "compliance", "license"]
            },

            industry_topics: {
                stablecoin_payments: {
                    name: "稳定币支付",
                    keywords_any: ["stablecoin", "USDC", "USDT", "PYUSD"],
                    keywords_context: ["payment", "settlement", "treasury"]
                },
                regulation_licensing: {
                    name: "监管牌照",
                    keywords_any: ["stablecoin", "crypto"],
                    keywords_context: ["regulation", "license", "MiCA"]
                }
            },

            twitter_event_keywords: {
                high_signal: ["launch", "partnership", "integration", "license"],
                medium_signal: ["expansion", "roadmap", "product"]
            },

            exclude_keywords: ["hiring", "job", "career", "webinar", "giveaway"],

            twitter_accounts: {
                kol: [
                    {username: "jerallaire", name: "Jeremy Allaire (Circle CEO)"},
                    {username: "paoloardoino", name: "Paolo Ardoino (Tether CTO)"}
                ],
                media: [
                    {username: "CoinDesk", name: "CoinDesk"},
                    {username: "TheBlock__", name: "The Block"}
                ]
            },

            search_keywords: {
                primary: ["stablecoin", "USDC", "USDT", "PYUSD"],
                secondary: ["digital dollar", "tokenized cash"]
            }
        };

        // 尝试从 localStorage 加载
        const saved = localStorage.getItem('stablecoin-config-v1.1');
        if (saved) {
            try {
                config = JSON.parse(saved);
            } catch (e) {}
        }

        // Tab 切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
                if (tab.dataset.tab === 'export') updatePreview();
            });
        });

        // 渲染函数
        function renderCompetitors() {
            const tier0Grid = document.getElementById('tier0-grid');
            const tier1Grid = document.getElementById('tier1-grid');

            tier0Grid.innerHTML = (config.competitors.tier_0_custody || []).map((c, i) => `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">${c.name}</span>
                        <span class="card-twitter">@${c.twitter}</span>
                    </div>
                    <div class="tags">
                        <button class="btn btn-danger" style="padding:4px 8px;font-size:0.75rem" onclick="removeCompetitor('tier_0_custody', ${i})">删除</button>
                    </div>
                </div>
            `).join('');

            tier1Grid.innerHTML = (config.competitors.tier_1_payment_infra || []).map((c, i) => `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">${c.name}</span>
                        <span class="card-twitter">@${c.twitter}</span>
                    </div>
                    <div class="tags">
                        <button class="btn btn-danger" style="padding:4px 8px;font-size:0.75rem" onclick="removeCompetitor('tier_1_payment_infra', ${i})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function renderCustomers() {
            const grid = document.getElementById('layer-a-grid');
            grid.innerHTML = (config.customers.layer_a || []).map((c, i) => `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">${c.name}</span>
                        <span class="card-twitter">@${c.twitter}</span>
                    </div>
                    <div class="tags">
                        <button class="btn btn-danger" style="padding:4px 8px;font-size:0.75rem" onclick="removeCustomer(${i})">删除</button>
                    </div>
                </div>
            `).join('');

            const ctxList = document.getElementById('context-keywords-list');
            ctxList.innerHTML = (config.customers.context_keywords || []).map((k, i) => `
                <div class="keyword">
                    ${k}
                    <button class="remove" onclick="removeContextKeyword(${i})">×</button>
                </div>
            `).join('');
        }

        function renderIndustryTopics() {
            const container = document.getElementById('industry-topics-container');
            let html = '';

            for (const [key, topic] of Object.entries(config.industry_topics || {})) {
                html += `
                    <div class="section" style="background:#252545;padding:15px;border-radius:8px;margin-bottom:15px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                            <h4 style="color:#00d4ff;">${topic.name || key}</h4>
                            <button class="btn btn-danger" style="padding:4px 8px;font-size:0.75rem" onclick="removeIndustryTopic('${key}')">删除话题</button>
                        </div>
                        <div style="margin-bottom:10px;">
                            <small style="color:#888;">keywords_any:</small>
                            <div class="keyword-list">${(topic.keywords_any || []).map(k => `<span class="tag">${k}</span>`).join('')}</div>
                        </div>
                        <div>
                            <small style="color:#888;">keywords_context:</small>
                            <div class="keyword-list">${(topic.keywords_context || []).map(k => `<span class="tag">${k}</span>`).join('')}</div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function renderKeywords() {
            if (!config.search_keywords) {
                config.search_keywords = { primary: [], secondary: [] };
            }

            ['primary', 'secondary'].forEach(type => {
                const list = document.getElementById(`${type}-keywords-list`);
                const keywords = config.search_keywords[type] || [];
                list.innerHTML = keywords.map((k, i) => `
                    <div class="keyword">
                        ${k}
                        <button class="remove" onclick="removeKeyword('${type}', ${i})">×</button>
                    </div>
                `).join('');
            });
        }

        function renderAccounts() {
            ['kol', 'media'].forEach(type => {
                const list = document.getElementById(`${type}-list`);
                list.innerHTML = (config.twitter_accounts[type] || []).map((a, i) => `
                    <div class="keyword">
                        @${a.username} <small style="color:#888">(${a.name})</small>
                        <button class="remove" onclick="removeAccount('${type}', ${i})">×</button>
                    </div>
                `).join('');
            });
        }

        function renderFilters() {
            const excludeList = document.getElementById('exclude-keywords-list');
            excludeList.innerHTML = (config.exclude_keywords || []).map((k, i) => `
                <div class="keyword">
                    ${k}
                    <button class="remove" onclick="removeExcludeKeyword(${i})">×</button>
                </div>
            `).join('');

            const highList = document.getElementById('high-signal-list');
            highList.innerHTML = ((config.twitter_event_keywords || {}).high_signal || []).map((k, i) => `
                <div class="keyword">
                    ${k}
                    <button class="remove" onclick="removeSignalKeyword('high_signal', ${i})">×</button>
                </div>
            `).join('');

            const mediumList = document.getElementById('medium-signal-list');
            mediumList.innerHTML = ((config.twitter_event_keywords || {}).medium_signal || []).map((k, i) => `
                <div class="keyword">
                    ${k}
                    <button class="remove" onclick="removeSignalKeyword('medium_signal', ${i})">×</button>
                </div>
            `).join('');
        }

        // 添加函数
        function addCompetitor() {
            const tier = document.getElementById('competitor-tier').value;
            const name = document.getElementById('new-competitor-name').value.trim();
            const twitter = document.getElementById('new-competitor-twitter').value.trim();

            if (name && twitter) {
                if (!config.competitors[tier]) config.competitors[tier] = [];
                config.competitors[tier].push({name, twitter});
                saveAndRender();
                document.getElementById('new-competitor-name').value = '';
                document.getElementById('new-competitor-twitter').value = '';
            }
        }

        function removeCompetitor(tier, index) {
            config.competitors[tier].splice(index, 1);
            saveAndRender();
        }

        function addCustomer() {
            const name = document.getElementById('new-customer-name').value.trim();
            const twitter = document.getElementById('new-customer-twitter').value.trim();

            if (name && twitter) {
                if (!config.customers.layer_a) config.customers.layer_a = [];
                config.customers.layer_a.push({name, twitter});
                saveAndRender();
                document.getElementById('new-customer-name').value = '';
                document.getElementById('new-customer-twitter').value = '';
            }
        }

        function removeCustomer(index) {
            config.customers.layer_a.splice(index, 1);
            saveAndRender();
        }

        function addContextKeyword() {
            const keyword = document.getElementById('new-context-keyword').value.trim();
            if (keyword) {
                if (!config.customers.context_keywords) config.customers.context_keywords = [];
                if (!config.customers.context_keywords.includes(keyword)) {
                    config.customers.context_keywords.push(keyword);
                    saveAndRender();
                }
                document.getElementById('new-context-keyword').value = '';
            }
        }

        function removeContextKeyword(index) {
            config.customers.context_keywords.splice(index, 1);
            saveAndRender();
        }

        function addIndustryTopic() {
            const key = document.getElementById('new-topic-key').value.trim();
            const name = document.getElementById('new-topic-name').value.trim();

            if (key && name) {
                if (!config.industry_topics) config.industry_topics = {};
                config.industry_topics[key] = {
                    name: name,
                    keywords_any: [],
                    keywords_context: []
                };
                saveAndRender();
                document.getElementById('new-topic-key').value = '';
                document.getElementById('new-topic-name').value = '';
            }
        }

        function removeIndustryTopic(key) {
            delete config.industry_topics[key];
            saveAndRender();
        }

        function addKeyword(type) {
            const input = document.getElementById(`new-${type}-keyword`);
            const keyword = input.value.trim();

            if (keyword) {
                if (!config.search_keywords) config.search_keywords = { primary: [], secondary: [] };
                if (!config.search_keywords[type]) config.search_keywords[type] = [];
                if (!config.search_keywords[type].includes(keyword)) {
                    config.search_keywords[type].push(keyword);
                    saveAndRender();
                }
                input.value = '';
            }
        }

        function removeKeyword(type, index) {
            config.search_keywords[type].splice(index, 1);
            saveAndRender();
        }

        function addAccount() {
            const type = document.getElementById('account-type').value;
            const username = document.getElementById('new-account-username').value.trim();
            const name = document.getElementById('new-account-name').value.trim();

            if (username && name) {
                if (!config.twitter_accounts[type]) config.twitter_accounts[type] = [];
                config.twitter_accounts[type].push({username, name});
                saveAndRender();
                document.getElementById('new-account-username').value = '';
                document.getElementById('new-account-name').value = '';
            }
        }

        function removeAccount(type, index) {
            config.twitter_accounts[type].splice(index, 1);
            saveAndRender();
        }

        function addExcludeKeyword() {
            const keyword = document.getElementById('new-exclude-keyword').value.trim();
            if (keyword) {
                if (!config.exclude_keywords) config.exclude_keywords = [];
                if (!config.exclude_keywords.includes(keyword)) {
                    config.exclude_keywords.push(keyword);
                    saveAndRender();
                }
                document.getElementById('new-exclude-keyword').value = '';
            }
        }

        function removeExcludeKeyword(index) {
            config.exclude_keywords.splice(index, 1);
            saveAndRender();
        }

        function addSignalKeyword(type) {
            const input = document.getElementById(`new-${type.replace('_', '-')}`);
            const keyword = input.value.trim();

            if (keyword) {
                if (!config.twitter_event_keywords) config.twitter_event_keywords = {};
                if (!config.twitter_event_keywords[type]) config.twitter_event_keywords[type] = [];
                if (!config.twitter_event_keywords[type].includes(keyword)) {
                    config.twitter_event_keywords[type].push(keyword);
                    saveAndRender();
                }
                input.value = '';
            }
        }

        function removeSignalKeyword(type, index) {
            config.twitter_event_keywords[type].splice(index, 1);
            saveAndRender();
        }

        function saveAndRender() {
            config.last_updated = new Date().toISOString().split('T')[0];
            localStorage.setItem('stablecoin-config-v1.1', JSON.stringify(config));
            renderAll();
        }

        function renderAll() {
            renderCompetitors();
            renderCustomers();
            renderIndustryTopics();
            renderKeywords();
            renderAccounts();
            renderFilters();
        }

        function updatePreview() {
            document.getElementById('json-preview').textContent = JSON.stringify(config, null, 2);
        }

        function downloadConfig() {
            const blob = new Blob([JSON.stringify(config, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'keywords.json';
            a.click();
            showStatus('✅ 配置文件已下载！请将其复制到 config/keywords.json', 'success');
        }

        function copyConfig() {
            navigator.clipboard.writeText(JSON.stringify(config, null, 2));
            showStatus('✅ 已复制到剪贴板！', 'success');
        }

        function importConfig(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        config = JSON.parse(e.target.result);
                        saveAndRender();
                        showStatus('✅ 配置导入成功！', 'success');
                    } catch (err) {
                        showStatus('❌ 配置文件格式错误', 'error');
                    }
                };
                reader.readAsText(file);
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            setTimeout(() => status.className = 'status', 3000);
        }

        // 初始化
        renderAll();
    </script>
</body>
</html>
